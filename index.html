<style>
@font-face{font-family:'Saira';font-style:normal;font-display:swap;font-weight:100 900;font-stretch:50% 125%;src:url(fonts/saira-latin-wdth-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Saira';font-style:normal;font-display:swap;font-weight:100 900;font-stretch:50% 125%;src:url(fonts/saira-latin-ext-wdth-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
html,body{margin:0;background:#05060a;color:#f3f5fa}
/* THE FORGE, the Beast Nutrition cut, about 2.5 s (shared engine: splash/forge.js, in the family's ice blue).
   0–.45 darkness, navy smoke, embers; .45–1.25 thousands of sparks stream in and lock into the wolf; 1.25 impact: flash,
   shake, shock ring, the wolf burns through, the fuel ring fills with this person's own protein, carbs and fat;
   1.4–1.95 BEAST NUTRITION stamped in, the rule, the tagline; 2.45 the sparks blow out and a blue slash opens the app. */
#splash{position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;background:#05070b;color:#f2f6fc;animation:sp-guard 0s linear 9s forwards}
@keyframes sp-guard{to{visibility:hidden;pointer-events:none}}
.sp-smoke,.sp-flash,.sp-vig{position:absolute;inset:0;pointer-events:none}
.sp-smoke{opacity:0}
.sp-smoke b{position:absolute;width:120vmax;height:120vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(76,10,18,.62),rgba(31,7,10,.3) 55%,transparent 72%);will-change:transform}
.sp-smoke b:nth-child(1){left:-70vmax;top:-30vmax}.sp-smoke b:nth-child(2){right:-74vmax;top:-12vmax}.sp-smoke b:nth-child(3){left:-30vmax;bottom:-84vmax}
.sp-go .sp-smoke{animation:sp-in .5s ease-out both}
.sp-go .sp-smoke b:nth-child(1){animation:sp-drift1 2.6s linear both}.sp-go .sp-smoke b:nth-child(2){animation:sp-drift2 2.6s linear both}.sp-go .sp-smoke b:nth-child(3){animation:sp-drift3 2.6s linear both}
.sp-vig{background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.72) 100%)}
#sp-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sp-flash{background:radial-gradient(circle at 50% 42%,#fff 0,#fff 5%,rgba(255,220,224,.85) 14%,rgba(214,31,51,.4) 32%,rgba(5,7,11,0) 56%);opacity:0}
.sp-cam{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:clamp(24px,4.6vh,38px);--w:min(54vw,33vh,300px)}
.sp-stage{position:relative;width:var(--w);aspect-ratio:680/801}
.sp-halo{position:absolute;left:50%;top:50%;width:170%;aspect-ratio:1;margin:-85% 0 0 -85%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(closest-side,rgba(163,16,31,.32),rgba(163,16,31,.08) 55%,transparent 74%)}
.sp-emb{position:absolute;inset:0;opacity:0;transform:scale(1.1)}
.sp-emb img{display:block;width:100%;height:100%;filter:drop-shadow(0 0 1px rgba(255,92,108,.85)) drop-shadow(0 0 16px rgba(163,16,31,.55))}
.sp-id{position:relative;display:grid;justify-items:center;gap:clamp(7px,1.3vh,12px)}
.sp-name{margin:0;font:900 extra-condensed clamp(46px,14vw,84px)/.9 'Saira','Arial Narrow',sans-serif;letter-spacing:.06em;margin-right:-.06em;text-transform:uppercase;white-space:nowrap}
.sp-name i{display:inline-block;font-style:normal;opacity:0;color:#f2f6fc;text-shadow:0 0 0 transparent}
.sp-name .b{color:#ff5c6c}
.sp-name .sp-gap{width:.28em}
.sp-rule{display:block;width:min(62vw,340px);height:2px;background:linear-gradient(90deg,transparent,#a3101f 22%,#ff5c6c 50%,#a3101f 78%,transparent);transform:scaleX(0);opacity:0}
.sp-tag{margin:0;font:700 semi-condensed clamp(11px,3vw,13.5px)/1.2 'Saira',system-ui,sans-serif;letter-spacing:.24em;margin-right:-.24em;color:#b9c3d0;white-space:nowrap;opacity:0}
.sp-skip{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));padding:10px 12px;border:0;background:none;color:#b9c3d0;font:700 semi-condensed 12px/1 'Saira',system-ui,sans-serif;letter-spacing:.16em;min-width:48px;min-height:48px;cursor:pointer;opacity:0;transition:opacity .3s}
.sp-go .sp-skip,.sp-calm .sp-skip{opacity:.8}
.sp-skip:focus-visible{outline:2px solid #ff5c6c;opacity:1}
/* the impact, keyed off .sp-hit (the engine adds it when the sparks lock) */
.sp-hit .sp-flash{animation:sp-flash .5s cubic-bezier(.16,1,.3,1) both}
.sp-hit .sp-emb{animation:sp-burn .55s cubic-bezier(.2,.8,.2,1) .05s forwards}
.sp-hit .sp-halo{animation:sp-in .7s ease-out .2s both}
.sp-hit .sp-name i{animation:sp-stamp .42s cubic-bezier(.2,1.4,.3,1) var(--d) forwards}
.sp-hit .sp-rule{animation:sp-rule .34s cubic-bezier(.2,.8,.2,1) .72s forwards}
.sp-hit .sp-tag{animation:sp-flicker .5s steps(1) .82s forwards}
/* reduced motion or the short intro: the finished picture, only faded */
.sp-calm .sp-emb{opacity:1;transform:none}.sp-calm .sp-halo{opacity:1}.sp-calm .sp-smoke{opacity:1}
.sp-calm .sp-name i,.sp-calm .sp-tag{opacity:1}.sp-calm .sp-rule{opacity:1;transform:none}
#splash.sp-fade{animation:none;opacity:0;transition:opacity .24s linear;pointer-events:none}
/* the entry: a blue slash, and the splash wiped away behind it */
#splash.sp-exit{animation:sp-wipe .46s cubic-bezier(.7,0,.2,1) forwards;pointer-events:none}
#sp-slash{position:fixed;z-index:101;top:-12vh;bottom:-12vh;left:0;width:30vw;min-width:150px;pointer-events:none;opacity:0;transform:translateX(-65vw) skewX(-8deg);background:linear-gradient(90deg,transparent,rgba(163,16,31,.5) 34%,#a3101f 47%,#ffd0d5 50%,#a3101f 53%,rgba(163,16,31,.34) 68%,transparent)}
#sp-slash.sp-exit{animation:sp-slash .46s cubic-bezier(.7,0,.2,1) forwards}
.sp-fail{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;text-align:center;font:600 16px/1.4 'Saira',system-ui,sans-serif;color:#f2f6fc}
.sp-fail a{color:#ff5c6c;font-weight:700}
@keyframes sp-in{to{opacity:1}}
@keyframes sp-drift1{to{transform:translate(9vmax,-3vmax)}}
@keyframes sp-drift2{to{transform:translate(-8vmax,4vmax)}}
@keyframes sp-drift3{to{transform:translate(5vmax,-6vmax)}}
@keyframes sp-flash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
@keyframes sp-burn{0%{opacity:0;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes sp-stamp{0%{opacity:0;transform:scale(1.7);text-shadow:-10px 0 0 #ff5c6c,10px 0 0 #ff2944}25%{opacity:1}60%{text-shadow:-3px 0 0 #ff5c6c,3px 0 0 #ff2944}100%{opacity:1;transform:none;text-shadow:0 0 0 transparent}}
@keyframes sp-rule{to{opacity:1;transform:none}}
@keyframes sp-flicker{0%{opacity:.8}12%{opacity:.1}24%{opacity:.9}36%{opacity:.25}52%,100%{opacity:1}}
@keyframes sp-wipe{from{clip-path:polygon(calc(-50% + 7vh) 0,220% 0,220% 100%,calc(-50% - 7vh) 100%)}to{clip-path:polygon(calc(130% + 7vh) 0,220% 0,220% 100%,calc(130% - 7vh) 100%)}}
@keyframes sp-slash{0%{opacity:1;transform:translateX(-65vw) skewX(-8deg)}100%{opacity:1;transform:translateX(115vw) skewX(-8deg)}}
/* the fuel ring: three arcs, one per macronutrient, drawn after the impact */
.sp-ring{position:absolute;left:50%;top:50%;width:134%;aspect-ratio:1;transform:translate(-50%,-50%);overflow:visible;pointer-events:none}
.sp-ring circle{fill:none;stroke-width:2.4}
.sp-ring .t{stroke:#2d1014;opacity:0}
.sp-ring .m{stroke-linecap:butt;stroke-dasharray:0 100;transform-origin:50% 50%;transform:rotate(var(--rot))}
.sp-ring .p{stroke:#f2f6fc}.sp-ring .c{stroke:#a3101f}.sp-ring .f{stroke:#ff5c6c}
.sp-hit .sp-ring .t{animation:sp-in .3s ease-out .1s forwards}
.sp-hit .sp-ring .p{animation:sp-arc .34s cubic-bezier(.3,0,.2,1) .2s forwards}
.sp-hit .sp-ring .c{animation:sp-arc .42s cubic-bezier(.3,0,.2,1) .45s forwards}
.sp-hit .sp-ring .f{animation:sp-arc .26s cubic-bezier(.3,0,.2,1) .8s forwards}
.sp-calm .sp-ring .t{opacity:1}.sp-calm .sp-ring .m{stroke-dasharray:var(--len) 100}
@keyframes sp-arc{to{stroke-dasharray:var(--len) 100}}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-smoke" aria-hidden="true"><b></b><b></b><b></b></div>
  <div class="sp-vig" aria-hidden="true"></div>
  <canvas id="sp-cv" aria-hidden="true"></canvas>
  <div class="sp-cam">
    <div class="sp-stage" aria-hidden="true">
      <div class="sp-halo"></div>
      <svg class="sp-ring" viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="57"/><circle class="m p" cx="60" cy="60" r="57" pathLength="100"/><circle class="m c" cx="60" cy="60" r="57" pathLength="100"/><circle class="m f" cx="60" cy="60" r="57" pathLength="100"/></svg>
      <div class="sp-emb"><img src="splash/umbra.webp" alt="" width="680" height="801" decoding="sync"></div>
    </div>
    <div class="sp-id">
      <p class="sp-name" aria-label="Beast Nutrition"><i style="--d:.16s">B</i><i style="--d:.2s">E</i><i style="--d:.24s">A</i><i style="--d:.28s">S</i><i style="--d:.32s">T</i><i class="sp-gap"></i><i class="b" style="--d:.4s">N</i><i class="b" style="--d:.43s">U</i><i class="b" style="--d:.46s">T</i><i class="b" style="--d:.49s">R</i><i class="b" style="--d:.52s">I</i><i class="b" style="--d:.55s">T</i><i class="b" style="--d:.58s">I</i><i class="b" style="--d:.61s">O</i><i class="b" style="--d:.64s">N</i></p>
      <i class="sp-rule" aria-hidden="true"></i>
      <p class="sp-tag">ENERGIE. PERFORMANȚĂ. RECUPERARE.</p>
    </div>
  </div>
  <div class="sp-flash" aria-hidden="true"></div>
  <button class="sp-skip" type="button" aria-label="Sari peste intro">Sari</button>
</div>
<div id="sp-slash" aria-hidden="true"></div>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// Plays on the first launch of the day by default, never on a reload in the same session, and a tap skips it.
// The session key is this app's own: both apps share an origin, and opening one must not silence the other.
// main.ts builds the dashboard underneath at the same time, so the exit only waits if that is genuinely not ready.
// The sparks are drawn by splash/forge.js, the engine shared by the Beast apps.
(function () {
  // The ring shows this person's own plan: each macro's share of the calories.
  try {
    var saved = JSON.parse(localStorage.getItem('beast-nutrition:v2') || 'null'), m = saved && saved.plan && saved.plan.macros;
    var parts = m && m.kcal > 0 ? [m.p * 4, m.c * 4, m.f * 9] : [30, 50, 20];
    var sum = parts[0] + parts[1] + parts[2], at = -90;
    ['p', 'c', 'f'].forEach(function (k, i) {
      var share = parts[i] / sum * 100, arc = document.querySelector('.sp-ring .' + k);
      if (arc) { arc.style.setProperty('--len', (share - 1.4).toFixed(2)); arc.style.setProperty('--rot', at.toFixed(1) + 'deg'); }
      at += share * 3.6;
    });
  } catch (e) { /* the default look of the stylesheet stays */ }
  var sp = document.getElementById('splash'), slash = document.getElementById('sp-slash');
  if (!sp) return;
  var mode = 'daily', seen = false, today = new Date().toDateString();
  try { mode = localStorage.getItem('beast-nutrition:opening') || 'daily'; } catch (e) { /* storage blocked */ }
  try { seen = sessionStorage.getItem('beast-nutrition:opened') === '1'; sessionStorage.setItem('beast-nutrition:opened', '1'); } catch (e) { /* storage blocked */ }
  try { if (mode === 'daily') { if (localStorage.getItem('beast-nutrition:opened-on') === today) seen = true; localStorage.setItem('beast-nutrition:opened-on', today); } } catch (e) { /* storage blocked */ }
  var forge = null;
  function drop() { if (forge) forge.destroy(); sp.remove(); if (slash) slash.remove(); }
  if (seen || mode === 'off') { drop(); return; }
  var conn = navigator.connection;
  var calm = mode === 'short' || matchMedia('(prefers-reduced-motion: reduce)').matches || !!(conn && conn.saveData) || !window.BeastForge;
  var HOLD = calm ? 800 : 2450, LIMIT = 6000;
  var t0 = 0, started = false, leaving = false, broken = false;
  function ready() { var a = document.getElementById('app'); return !!a && a.children.length > 0; }
  addEventListener('error', function (e) { if (e.error || (e.target && e.target.tagName === 'SCRIPT')) broken = true; }, true);
  function leave() {
    if (leaving) return;
    if (!ready() && !broken && performance.now() - t0 < LIMIT) { setTimeout(leave, 60); return; }
    leaving = true;
    if (!ready()) {
      var a = document.getElementById('app');
      if (a) a.innerHTML = '<div class="sp-fail"><p>Aplicația nu s-a putut încărca.</p><a href="./">Încearcă din nou</a></div>';
    }
    if (calm || !ready()) { sp.classList.add('sp-fade'); setTimeout(drop, 280); return; }
    if (forge) forge.burst();
    sp.classList.add('sp-exit');
    if (slash) slash.classList.add('sp-exit');
    setTimeout(drop, 480);
  }
  function go() {
    if (started) return;
    started = true;
    t0 = performance.now();
    if (calm) { sp.classList.add('sp-calm'); setTimeout(leave, HOLD); return; }
    sp.classList.add('sp-go');
    forge = window.BeastForge.create({
      canvas: document.getElementById('sp-cv'), mark: 'splash/umbra.webp', stage: sp.querySelector('.sp-stage'),
      color: [163, 16, 31], hot: [255, 92, 108], count: 2400,
      onImpact: function () { sp.classList.add('sp-hit'); try { navigator.vibrate && navigator.vibrate(40); } catch (e) { /* not here */ } }
    });
    forge.start();
    setTimeout(leave, HOLD);
  }
  // starts when the dashboard underneath is drawn, so that work does not stutter the sparks; after half a second anyway
  var boot = performance.now();
  (function arm() { if (started) return; if (ready() || performance.now() - boot > 500) { requestAnimationFrame(go); return; } setTimeout(arm, 25); })();
  function skip() { if (!started) go(); t0 = t0 || performance.now(); leave(); }
  sp.addEventListener('click', skip);
  addEventListener('keydown', function k(e) {
    if (!sp.isConnected) { removeEventListener('keydown', k); return; }
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') skip();
  });
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
